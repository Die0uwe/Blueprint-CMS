name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} — tests, static analysis, code style
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    # Echte database voor tests/Integration (wachtwoordherstel e.d.).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bluprint_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, curl, openssl, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax (src, modules, installer, cli, tests)
        run: |
          find src modules installer cli tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Import schema for integration tests
        run: mysql -h127.0.0.1 -uroot -proot bluprint_test < src/Core/Database/schema.sql

      - name: PHPUnit
        shell: bash
        run: |
          set +e
          composer test 2>&1 | tee phpunit-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Logs zijn niet altijd leesbaar buiten de Actions-UI; zet het eind van de
            # uitvoer daarom ook als annotatie (zichtbaar via API/PR-checks).
            msg=$(tail -n 40 phpunit-output.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PHPUnit uitvoer (laatste regels)::$msg"
          fi
          exit $code
        env:
          CF_TEST_DB_HOST: 127.0.0.1
          CF_TEST_DB_NAME: bluprint_test
          CF_TEST_DB_USER: root
          CF_TEST_DB_PASS: root

      - name: PHPStan (level 8, gescoped via phpstan.neon)
        shell: bash
        run: |
          set +e
          vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=raw 2>&1 | tee phpstan-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(sed 's#'"$GITHUB_WORKSPACE"'/##' phpstan-output.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PHPStan::$msg"
          fi
          exit $code

      # De rest van src/ is nog niet level-8-schoon (~580 meldingen, vooral view-variabelen
      # en array-types; zie phpstan.neon). Informatief, blokkeert de build niet.
      - name: PHPStan (volledige src, informatief)
        continue-on-error: true
        run: vendor/bin/phpstan analyse src --level=8 --no-progress --error-format=raw | tail -n 5

      - name: PHP CodeSniffer (PSR-12, src only)
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs --standard=PSR12 src/ --report=summary 2>&1 | tee phpcs-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 30 phpcs-output.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=phpcs::$msg"
          fi
          exit $code

  mariadb-schema:
    name: Import schema.sql against MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bluprint_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import core schema
        run: |
          mysql -h127.0.0.1 -uroot -proot bluprint_test < src/Core/Database/schema.sql

      - name: Import module schemas (self-installing modules)
        run: |
          for f in modules/*/install.sql; do
            [ -f "$f" ] && mysql -h127.0.0.1 -uroot -proot bluprint_test < "$f"
          done || true
